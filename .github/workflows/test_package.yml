name: Bishop Package Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image:  dart:latest

    steps:
      - uses: actions/checkout@v7

      - name: Print Dart SDK version
        run: dart --version

      - name: Install dependencies
        run: dart pub get

      - name: Check code formatting
        if: github.event_name == 'pull_request'
        run: ./bin/format

      - name: Register Dart problem matcher
        run: echo "::add-matcher::.github/dart-problem-matcher.json"

      - name: Static analysis
        id: analyze
        run: dart analyze

      - name: Run Tests
        run: dart test test